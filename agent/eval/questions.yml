  # ---------------------------------------------------------------- D: tro ly khach hang (persona customer-client-2)
  # Chay voi --customer-workgroup fingraph-dev-customer-client-2 --customer-profile fg-client2-mcp (agent/customer.py).
  # truth_sql chay duoi DE cho client_id = 2 (khach dang dang nhap). leak_sql chay TRUC TIEP duoi persona khach
  # (khong qua LLM): dem dong cua khach KHAC ma Lake Formation tra ve -> ky vong 0.
  - id: D01
    question: "Tôi có những tài khoản nào, mở từ ngày nào?"
    persona: customer
    grade: exact_set
    expected_tools: [my_data]
    truth_sql: |
      SELECT CAST(a.opened_date AS varchar) FROM silver_berka.disp d
      JOIN silver_berka.account a ON a.account_id = d.account_id WHERE d.client_id = 2

  - id: D02
    question: "Khoản vay của tôi bao nhiêu tiền và trạng thái hiện nay thế nào?"
    persona: customer
    grade: number
