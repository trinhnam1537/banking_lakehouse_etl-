  # ---------------------------------------------------------------- B: AML (them, khong can Neptune)
  - id: B09
    question: "Có bao nhiêu vụ rửa tiền kiểu CYCLE?"
    cq: CQ9
    persona: analyst
    grade: number
    expected_tools: [metric]
    truth_sql: |
      SELECT count(DISTINCT attempt_id) FROM silver_aml.laundering_attempt WHERE typology = 'CYCLE'

  - id: B10
    question: "Số vụ rửa tiền theo từng kiểu hình là bao nhiêu?"
    cq: CQ9
    persona: analyst
    grade: number
    expected_tools: [metric]
    truth_sql: |
      SELECT typology, count(DISTINCT attempt_id) FROM silver_aml.laundering_attempt GROUP BY typology

  - id: B11
    question: "Vụ rửa tiền {attempt_id} gồm bao nhiêu giao dịch?"
