  # ---------------------------------------------------------------- C: BA tu phuc vu (thong ke)
  - id: C01
    question: "Tỉ lệ đăng ký tiền gửi có kỳ hạn của Bank Marketing theo tình trạng hôn nhân?"
    cq: CQ12
    persona: analyst
    grade: number
    expected_tools: [metric]
    truth_sql: |
      SELECT marital, avg(CAST(subscribed AS double)) FROM (
        SELECT marital, subscribed FROM silver_bank_marketing.contact_full
        UNION ALL SELECT marital, subscribed FROM silver_bank_marketing.contact_additional) t GROUP BY marital

  - id: C02
    question: "Tỉ lệ khoản vay có vấn đề (không trả đủ) của Berka theo từng vùng?"
    cq: CQ12
    persona: analyst
    grade: number
    expected_tools: [metric]
    truth_sql: |
      SELECT x.region, avg(CASE WHEN l.is_problem_loan THEN 1.0 ELSE 0.0 END) FROM silver_berka.loan l
      JOIN silver_berka.account a ON a.account_id = l.account_id
      JOIN silver_berka.district x ON x.district_id = a.district_id GROUP BY x.region

  - id: C03
    question: "Berka có bao nhiêu khoản vay theo từng trạng thái?"
    cq: CQ12
    persona: analyst
    grade: number
    expected_tools: [metric]
    truth_sql: |
      SELECT loan_status, count(*) FROM silver_berka.loan GROUP BY loan_status

  - id: C04
    question: "Số tiền vay trung bình của khách Berka ở vùng Prague là bao nhiêu CZK?"
    cq: CQ12
    persona: analyst
    grade: number
    expected_tools: [metric]
    truth_sql: |
      SELECT round(avg(l.amount), 0) FROM silver_berka.loan l
      JOIN silver_berka.account a ON a.account_id = l.account_id
      JOIN silver_berka.district x ON x.district_id = a.district_id WHERE x.region = 'Prague'

  - id: C05
    question: "Số giao dịch gian lận của ví điện tử PaySim theo từng loại giao dịch?"
    cq: CQ12
    persona: analyst
    grade: number
    expected_tools: [metric]
    truth_sql: |
      SELECT t.txn_type, sum(CASE WHEN f.is_fraud THEN 1 ELSE 0 END) FROM silver_paysim.transaction t
      JOIN silver_paysim.fraud_label f ON f.txn_ref = t.txn_ref GROUP BY t.txn_type

  - id: C06
    question: "Rule gian lận thẻ MULTI_RULE_2 (từ 2 rule trở lên trong 2 giờ) có precision và recall bao nhiêu ở mức giao dịch?"
    cq: CQ12
    persona: analyst
    grade: number
    expected_tools: [metric]
    truth_sql: |
      SELECT 'precision' k, round(precision, 4) FROM track_a_gold.card_rule_eval_summary
      WHERE rule = 'MULTI_RULE_2' AND level = 'txn' AND severity = 'any'
      UNION ALL SELECT 'recall', round(recall, 4) FROM track_a_gold.card_rule_eval_summary
      WHERE rule = 'MULTI_RULE_2' AND level = 'txn' AND severity = 'any'

  - id: C07
    question: "Mỗi vùng có bao nhiêu khách Berka?"
    cq: CQ12
    persona: analyst
    grade: number
    expected_tools: [metric]
    truth_sql: |
      SELECT x.region, count(DISTINCT c.client_id) FROM silver_berka.client c
      JOIN silver_berka.district x ON x.district_id = c.district_id GROUP BY x.region

  - id: C08
    question: "Có bao nhiêu doanh nghiệp MBD mua ít nhất một sản phẩm trong kỳ quan sát?"
    cq: CQ12
    persona: analyst
    grade: number
    expected_tools: [metric]
    truth_sql: |
      SELECT count(*) FROM (SELECT client_id FROM silver_mbd.target_month GROUP BY client_id
        HAVING max(CAST(target_1 AS int) + CAST(target_2 AS int) + CAST(target_3 AS int) + CAST(target_4 AS int)) > 0)

  - id: C09
    question: "Tỉ lệ khách Berka có thẻ vàng ở mỗi vùng?"
    cq: CQ2
    persona: analyst
    grade: number
    expected_tools: [count_holders, metric]
    note: "Can ket hop: so khach giu fin:GoldCard theo vung (do thi) / so khach theo vung (metric)"
    truth_sql: |
      SELECT x.region, CAST(count(DISTINCT g.client_id) AS double) / count(DISTINCT c.client_id)
      FROM silver_berka.client c JOIN silver_berka.district x ON x.district_id = c.district_id
      LEFT JOIN (SELECT client_id FROM track_a_gold.berka_product_event WHERE product = 'card_gold') g
        ON g.client_id = c.client_id GROUP BY x.region

  - id: C10
    question: "Nhóm ngành merchant nào có số tiền giao dịch thẻ trung bình cao nhất?"
