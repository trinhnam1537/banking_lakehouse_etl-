# MBD — Multimodal Banking Dataset (Sber AI Lab, arXiv 2409.17587), ban MINI tren Hugging Face:
# https://huggingface.co/datasets/ai-lab/MBD-mini — targets.tar.gz (~8 MB, nhan 4 san pham theo thang).
# Moi archive la mot thu muc parquet chia theo fold=0..4 (Hive) -> cot "fold" duoc them tu ten thu muc.
# UC2: targets = nhan mua 4 san pham trong thang sau ngay bao cao (target_1..4). Tai lieu: docs/sourcing/uc2-datasets.md

name: mbd_targets
source_type: httpfile
description: "MBD-mini targets (parquet trong tar.gz, Hugging Face ai-lab/MBD-mini)"
owner: namth
enabled: true

httpfile:
  urls:
    mbd_mini_targets: "https://huggingface.co/datasets/ai-lab/MBD-mini/resolve/main/targets.tar.gz"
  compression: tar.gz
  archive_members: ["targets/*.parquet"]
  file_format: parquet
  timeout_seconds: 300

cdc:
  mode: cdc5

target:
  dataset: mbd/targets

schedule:
  enabled: false
  expression: "cron(0 3 1 * ? *)"

runtime:
  profile: src-shell
  timeout_minutes: 30
