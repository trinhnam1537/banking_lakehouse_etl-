# MBD — Multimodal Banking Dataset (Sber AI Lab, arXiv 2409.17587), ban MINI tren Hugging Face:
# https://huggingface.co/datasets/ai-lab/MBD-mini — client_split.tar.gz (~4 MB, client_id -> fold).
# Moi archive la mot thu muc parquet chia theo fold=0..4 (Hive) -> cot "fold" duoc them tu ten thu muc.
# UC2: targets = nhan mua 4 san pham trong thang sau ngay bao cao (target_1..4). Tai lieu: docs/sourcing/uc2-datasets.md

name: mbd_client_split
source_type: httpfile
description: "MBD-mini client_split (parquet trong tar.gz, Hugging Face ai-lab/MBD-mini)"
owner: namth
enabled: true

httpfile:
  urls:
    mbd_mini_client_split: "https://huggingface.co/datasets/ai-lab/MBD-mini/resolve/main/client_split.tar.gz"
  compression: tar.gz
  archive_members: ["client_split/*.parquet"]
  file_format: parquet
  timeout_seconds: 300

cdc:
  mode: cdc5

target:
  dataset: mbd/client_split

schedule:
  enabled: false
  expression: "cron(0 3 1 * ? *)"

runtime:
  profile: src-shell
  timeout_minutes: 30
