# SEC EDGAR frames — Revenues cua MOI doanh nghiep trong ky CY2023Q1
#
# Day la endpoint dang dung nhat cua SEC cho mot lakehouse: no tra ve mot
# MANG ban ghi phang tai `data`, moi dong la mot doanh nghiep. Khac han
# `sec_submissions` von la object long 16 mang song song theo cot — thu
# phai transpose o bronze moi dung duoc.
#
# Doi `path` la doi chi tieu hoac doi ky.
#
# CAI BAY CUA HAU TO `I`: XBRL chia chi tieu thanh hai loai va ky phai khop
# loai, neu khong API van tra HTTP 200 nhung gan nhu rong:
#
#   THOI DIEM (instant)  — Assets, Liabilities...  -> ky co `I`:  CY2023Q1I
#   THOI KY   (duration) — Revenues, NetIncomeLoss -> ky KHONG `I`: CY2023Q1
#
# Revenues voi CY2023Q1I tra ve 5 ban ghi; voi CY2023Q1 tra ve 2206.
# Kiem SO BAN GHI, dung chi kiem ma trang thai HTTP.
#
# CDC5: mot ky da dong thi so lieu co dinh, SEC chi sua khi co dinh chinh.

name: sec_frames_revenues
source_type: api
description: Chi tieu Revenues ky CY2023Q1, moi doanh nghiep mot dong
owner: namth
enabled: true

api:
  base_url: https://data.sec.gov
  path: api/xbrl/frames/us-gaap/Revenues/USD/CY2023Q1.json
  records_path: data
  pagination: none
  rate_limit_per_sec: 8
  headers:
    User-Agent: "HUST FinGraph Research trinhnama31609@gmail.com"

cdc:
  mode: cdc5

target:
  dataset: sec/frames_revenues
  max_records_per_file: 20000

schedule:
  enabled: false
  expression: "cron(0 20 * * ? *)"

runtime:
  engine: python_shell
  timeout_minutes: 20
