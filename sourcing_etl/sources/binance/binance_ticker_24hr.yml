# Binance REST — thong ke 24 gio moi cap
#
# Khac `kafka_trades`: job kia hut lenh khop THEO DONG tu Redpanda, job nay
# chup ANH TINH cua thi truong theo lich. Hai gia tri khac nhau, khong thay
# the nhau.
#
# CDC5: anh chup tai mot thoi diem, khong co moc de keo tiep.

name: binance_ticker_24hr
source_type: api
description: Thong ke 24 gio moi cap
owner: namth
enabled: true

api:
  base_url: https://api.binance.com/api/v3
  path: ticker/24hr
  records_path: ""
  pagination: none
  rate_limit_per_sec: 5

cdc:
  mode: cdc5

target:
  dataset: binance/ticker_24hr

schedule:
  enabled: false
  expression: "rate(1 hour)"

runtime:
  engine: python_shell
  timeout_minutes: 15
