# GLEIF — danh tính pháp nhân toàn cầu, dùng cho tầng ontology (tuần 8-9).
#
# CDC5 (full snapshot) vì hai lý do:
#   - tập đang kéo nhỏ (lọc theo quốc gia), kéo lại toàn bộ rẻ hơn là theo dõi
#     cột mốc
#   - GLEIF sửa bản ghi hồi tố khi pháp nhân cập nhật hồ sơ; CDC1 sẽ bỏ sót
#     những thay đổi đó mà không báo lỗi gì
#
# QUAN HỆ SỞ HỮU — nguồn cạnh `fin:isDirectlyOwnedBy` cho onto_closure:
# `include=direct-parent,ultimate-parent` bắt GLEIF trả công ty mẹ NGAY TRONG
# response, ở khối `included` (JSON:API) — không phải gọi từng LEI một.
# Khối này nằm NGOÀI `data`, nên chỉ sống sót nhờ raw_mode=response.
#   included[type=lei-records]          công ty mẹ (có thể ở nước khác: Danone FR)
#   included[type=reporting-exceptions] lý do không khai mẹ: NO_LEI,
#                                       NATURAL_PERSONS, NON_CONSOLIDATING...
# Silver ghép: data[i].relationships.direct-parent.links -> LEI mẹ.
# Kiểm 09-27: trang đầu 200 pháp nhân VN -> 59 mẹ + 304 exception.

name: gleif_lei
source_type: api
description: Ban ghi LEI cua phap nhan, loc theo quoc gia
owner: namth
enabled: true

api:
  base_url: https://api.gleif.org/api/v1
  path: lei-records
  records_path: data
  pagination: page
  page_param: "page[number]"
  page_size_param: "page[size]"
  page_size: 200
  max_pages: 50
  rate_limit_per_sec: 3
  query:
    filter[entity.legalAddress.country]: VN
    include: "direct-parent,ultimate-parent"

cdc:
  mode: cdc5

target:
  dataset: gleif/lei_records
  max_records_per_file: 20000

schedule:
  # Tat 09-27: moi job sourcing deu chet vi ModuleNotFoundError (xem SETUP-LOG
  # muc 6). Bat lai sau khi run-source.ps1 chay SUCCESS tren Glue.
  enabled: false
  expression: "cron(0 19 * * ? *)"   # 02:00 gio VN moi ngay

runtime:
  engine: python_shell
  timeout_minutes: 20
