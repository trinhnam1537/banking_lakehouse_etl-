# GLEIF — ma vung ISO 3166-2
#
# Bang tham chieu cua he thong dinh danh phap nhan toan cau. Nho, it doi, va
# la ve phai cua moi phep noi o tang ontology (tuan 8-9).
#
# CDC5: tap rat nho, va GLEIF sua ban ghi hoi to khi ho cap nhat chuan.

name: gleif_regions
source_type: api
description: Ma vung ISO 3166-2
owner: namth
enabled: true

api:
  base_url: https://api.gleif.org/api/v1
  path: regions
  records_path: data
  pagination: page
  page_param: "page[number]"
  page_size_param: "page[size]"
  page_size: 200
  max_pages: 20
  rate_limit_per_sec: 3

cdc:
  mode: cdc5

target:
  dataset: gleif/regions

schedule:
  enabled: false
  expression: "cron(0 19 ? * SUN *)"

runtime:
  engine: python_shell
  timeout_minutes: 15
