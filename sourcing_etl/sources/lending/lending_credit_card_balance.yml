# He thong cho vay gia lap: Postgres lending theo Home Credit Default Risk (Kaggle).
# Phan tich nguon, schema, credential: docs/sourcing/lending.md
# Profile src-vpc -> enabled: false cho toi khi repo ha tang tao profile.
# Chay tren may: python -m local.run_entry lending_credit_card_balance

name: lending_credit_card_balance
source_type: jdbc
description: So du thang the tin dung — CDC1 chia khuc theo id
owner: namth
enabled: false

jdbc:
  secret_name: fingraph/src/lending_pg
  driver: postgresql
  chunk_size: 100000
  query: |
    SELECT id, sk_id_prev, sk_id_curr, months_balance, amt_balance, amt_credit_limit_actual,
           amt_drawings_current, amt_payment_current, amt_total_receivable,
           cnt_drawings_current, name_contract_status, sk_dpd, created_at
    FROM lending.credit_card_balance
    WHERE id > :watermark
    ORDER BY id
    LIMIT :chunk_size

cdc:
  mode: cdc1
  watermark_column: id
  watermark_type: int
  initial_watermark: "0"

target:
  dataset: lending/credit_card_balance

schedule:
  # 01:30 gio VN.
  enabled: false
  expression: "cron(30 18 * * ? *)"

runtime:
  profile: src-vpc
  timeout_minutes: 60
