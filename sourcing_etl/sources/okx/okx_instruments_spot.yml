# OKX — danh muc cong cu giao ngay
#
# San thu hai ben canh Binance. Muc dich la DOI CHUNG: cung mot tai san,
# hai san, lech gia bao nhieu. Day la cau hoi co noi dung cho luan van, va
# no chi tra loi duoc khi co tu hai nguon tro len.
#
# CDC5: anh chup theo lich.

name: okx_instruments_spot
source_type: api
description: Danh muc cong cu giao ngay
owner: namth
enabled: true

api:
  base_url: https://www.okx.com/api/v5
  path: public/instruments
  records_path: data
  pagination: none
  rate_limit_per_sec: 5
  query:
    instType: "SPOT"

cdc:
  mode: cdc5

target:
  dataset: okx/instruments_spot

schedule:
  enabled: false
  expression: "rate(1 hour)"

runtime:
  engine: python_shell
  timeout_minutes: 15
