# OKX — vi the mo toan bo hop dong
#
# San thu hai ben canh Binance. Muc dich la DOI CHUNG: cung mot tai san,
# hai san, lech gia bao nhieu. Day la cau hoi co noi dung cho luan van, va
# no chi tra loi duoc khi co tu hai nguon tro len.
#
# CDC5: anh chup theo lich.

name: okx_open_interest
source_type: api
description: Vi the mo toan bo hop dong
owner: namth
enabled: true

api:
  base_url: https://www.okx.com/api/v5
  path: public/open-interest
  records_path: data
  pagination: none
  rate_limit_per_sec: 5
  query:
    instType: "SWAP"

cdc:
  mode: cdc5

target:
  dataset: okx/open_interest

schedule:
  enabled: false
  expression: "rate(1 hour)"

runtime:
  engine: python_shell
  timeout_minutes: 15
