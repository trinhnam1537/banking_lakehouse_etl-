# Giao dich the sinh boi simulators.cards.stream (kieu Sparkov), chu the = khach core banking.
# cc_num DA CHE, card_token = md5(so the) noi ve corebank_card. Khong co is_fraud
# (xem cards_chargebacks). Tai lieu: docs/sourcing/cards.md

name: cards_authorizations
source_type: kafka
description: Giao dich the kieu Sparkov (so the da che + card_token) tu Kafka
owner: namth
# Bat 10-31: consumer chay TREN MAY NGUON (profile edge), canh broker Redpanda.
# Producer = systemd fingraph-cards-stream (simulators.cards.stream --live).
enabled: true

kafka:
  # IP rieng cua EC2 doi moi lan spot bi dung lai -> tham so Glue, khong ghi cung
  bootstrap_servers: "${KAFKA_BOOTSTRAP}"
  topic: card.authorizations
  group_id: fingraph-src-cards
  auto_offset_reset: earliest
  max_records_per_run: 500000
  poll_timeout_seconds: 10

cdc:
  mode: cdc1   # moc = offset tung partition, khong can watermark_column

target:
  dataset: cards/authorizations
  max_records_per_file: 100000

schedule:
  # Lich KHONG o day: systemd timer fingraph-kafka-sink tren may nguon, 5 phut/lan
  # (repo ha tang modules/kafka, var.kafka_sink_interval). Glue Streaming ~20 USD/ngay.
  enabled: false
  expression: "rate(5 minutes)"

runtime:
  # edge = chay tren may nguon EC2, khong qua Glue (Glue ngoai VPC khong toi duoc broker)
  profile: edge
  timeout_minutes: 10
