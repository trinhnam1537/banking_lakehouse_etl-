# FDIC BankFind — danh sach to chuc tin dung
#
# Toan bo he thong ngan hang My (~27.800 to chuc) kem lich su sap nhap va do
# vo. Day la tap do thi that — to chuc, chi nhanh, quan he thau tom giua
# chung — nen no phuc vu tang ontology hon la bang gia.
#
# Phan trang kieu `offset` va `limit`, khong phai so trang.
#
# CDC5 theo yeu cau; cac bang nay deu nho va it doi.

name: fdic_institutions
source_type: api
description: Danh sach to chuc tin dung
owner: namth
enabled: true

api:
  base_url: https://banks.data.fdic.gov/api
  path: institutions
  records_path: data
  pagination: offset
  page_param: "offset"
  page_size_param: "limit"
  page_size: 1000
  max_pages: 30
  rate_limit_per_sec: 5
  query:
    format: "json"

cdc:
  mode: cdc5

target:
  dataset: fdic/institutions
  max_records_per_file: 20000

schedule:
  enabled: false
  expression: "cron(0 22 ? * SUN *)"

runtime:
  engine: python_shell
  timeout_minutes: 25
