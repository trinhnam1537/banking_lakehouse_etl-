# NHAN TRE: nhan khong di cung giao dich (ngan hang chi biet sau dieu tra/chargeback).
# Simulator ghi file nhan sau N ngay nghiep vu. KHONG dung lam dac trung cho mo hinh
# phat hien thoi gian thuc — chi de huan luyen/danh gia.
# Tai lieu: docs/sourcing/ibm-aml.md

name: aml_labels
source_type: s3file
description: "IBM AML: nhan rua tien (txn_id, is_laundering), den tre 14 ngay"
owner: namth
enabled: true

s3file:
  bucket: "${RAW_BUCKET}"
  prefix: landing/_inbox/aml/labels/
  file_format: csv
  compression: gzip

cdc:
  mode: cdc1
  # Moc = KHOA S3 cua file cuoi da nap; prefix dt=YYYY-MM-DD giu thu tu tu dien
  watermark_column: _s3_key
  watermark_type: string

target:
  dataset: aml/labels

schedule:
  # Bat sau khi chay tay thanh cong it nhat mot lan.
  enabled: false
  expression: "cron(0 1 * * ? *)"

# HI-Medium: lich su ~32 trieu nhan (replay history) -> Spark co S. Luong song hang
# ngay chi vai file nho: ton toi thieu 1 phut x 2 G.1X (~0,015 USD/lan).
runtime:
  engine: spark
  profile: src-spark
  size: S
  timeout_minutes: 30
