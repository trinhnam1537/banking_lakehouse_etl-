# Alpha Vantage — lich su chi tra co tuc
#
# enabled: false — CHUA co khoa. Bat len sau khi tao secret:
#
#   aws secretsmanager create-secret --name fingraph/alphavantage \
#       --secret-string '{"apikey":"<KHOA>"}' --profile fingraph
#
# QUAN TRONG: ban mien phi chi 25 lan goi MOI NGAY — khong du cho bay entry
# nay chay hang ngay. Nhung Alpha Vantage cap ban KHONG GIOI HAN cho du an
# giao duc va ma nguon mo (xem alphavantage.co/support). Do an tot nghiep
# thuoc dien nay — xin truoc khi bat lich.
#
# Endpoint premium (khong co o ban mien phi) da duoc loai khoi nhom nay:
# TIME_SERIES_INTRADAY, TIME_SERIES_DAILY_ADJUSTED, FX_INTRADAY,
# CRYPTO_INTRADAY, MACD, VWAP, REALTIME_*, INDEX_DATA, HISTORICAL_OPTIONS.
#
# CDC5: moi lan goi tra ve toan bo lich su cua ma do, khong co phan them.

name: av_dividends
source_type: api
description: Lich su chi tra co tuc
owner: namth
enabled: false

api:
  base_url: https://www.alphavantage.co
  path: query
  records_path: data
  pagination: none
  rate_limit_per_sec: 0.4
  query:
    function: "DIVIDENDS"
    symbol: "IBM"
  secret_name: fingraph/alphavantage
  secret_inject:
    apikey: query.apikey

cdc:
  mode: cdc5

target:
  dataset: alphavantage/dividends

schedule:
  enabled: false
  expression: "cron(0 23 * * ? *)"

runtime:
  engine: python_shell
  timeout_minutes: 15
