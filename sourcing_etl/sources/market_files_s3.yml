# Nhánh batch: file do bên ngoài đẩy vào S3.
#
# Hai đường vào tầng raw cho cùng loại dữ liệu này:
#
#   1. Job này — quét theo prefix, chạy theo lịch. Đơn giản, dễ chạy lại,
#      phù hợp khi file về theo lô và độ trễ vài phút là chấp nhận được.
#   2. Lambda theo sự kiện S3 — xử lý ngay khi file rơi xuống. Độ trễ vài
#      giây, nhưng khó chạy lại và khó debug hơn.
#
# Đường 1 là mặc định. Dùng đường 2 khi thực sự cần độ trễ thấp —
# xem sourcing/lambda_handler.py.
#
# Mốc CDC1 là KHOÁ S3 của file cuối đã xử lý, không phải thời gian:
# LastModified có thể trùng nhau khi upload hàng loạt, còn khoá thì duy nhất
# và list_objects_v2 trả về theo thứ tự từ điển.

name: market_files_s3
source_type: s3file
description: File CSV/JSON do ben ngoai day vao landing
owner: namth
enabled: true

s3file:
  bucket: "${RAW_BUCKET}"
  prefix: landing/_inbox/market/
  file_format: csv
  csv_delimiter: ","
  compression: none

cdc:
  mode: cdc1
  watermark_column: _s3_key    # framework tu dung khoa S3 lam moc
  watermark_type: string

target:
  dataset: files/market
  max_records_per_file: 50000

schedule:
  # Tat 09-27: job chet vi ModuleNotFoundError. Bat lai sau khi Glue chay duoc.
  enabled: false
  expression: "rate(15 minutes)"

runtime:
  engine: python_shell
  timeout_minutes: 20
