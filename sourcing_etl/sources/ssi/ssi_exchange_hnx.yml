# SSI iBoard — toan bo ma niem yet san HNX
#
# API noi bo cua bang gia SSI. Khong can khoa, nhung CAN header `Referer`:
# thieu no la 403.
#
# Day la nguon danh muc cong cu tai chinh Viet Nam duy nhat tim duoc ma vua
# mien phi vua tra ve ma ISIN — tuc noi duoc sang GLEIF va OpenFIGI. Vi vay
# no thay cho `pg_instruments` (nguon RDS chua bao gio duoc dung).
#
# CDC5: bang danh muc, khong co cot moc dang tin.
#
# CANH BAO: API khong co tai lieu chinh thuc va co the doi bat ky luc nao.
# Job hong dot ngot thi kiem tra lai duong dan truoc khi nghi framework loi.

name: ssi_exchange_hnx
source_type: api
description: Toan bo ma niem yet san HNX
owner: namth
enabled: true

api:
  base_url: https://iboard-query.ssi.com.vn
  path: stock/exchange/hnx
  records_path: data
  pagination: none
  rate_limit_per_sec: 2
  headers:
    Referer: "https://iboard.ssi.com.vn/"
    Origin: "https://iboard.ssi.com.vn"

cdc:
  mode: cdc5

target:
  dataset: ssi/exchange_hnx

schedule:
  enabled: false
  expression: "cron(0 10 ? * MON-FRI *)"

runtime:
  engine: python_shell
  timeout_minutes: 15
