# US Treasury FiscalData — ket qua dau thau trai phieu
#
# API chinh thuc cua Bo Tai chinh My. Khong can khoa, phan trang kieu
# `page[number]` va `page[size]` giong het GLEIF.
#
# CDC5 tam thoi theo yeu cau. Day la nhung bang CHI THEM (append-only) co cot
# `record_date` rat dang tin — khi nao can tiet kiem thi doi sang cdc1 voi
# `watermark_column: record_date` la keo incremental duoc ngay.

name: treasury_auctions
source_type: api
description: Ket qua dau thau trai phieu
owner: namth
enabled: true

api:
  base_url: https://api.fiscaldata.treasury.gov/services/api/fiscal_service
  path: v1/accounting/od/auctions_query
  records_path: data
  pagination: page
  page_param: "page[number]"
  page_size_param: "page[size]"
  page_size: 1000
  max_pages: 20
  rate_limit_per_sec: 5

cdc:
  mode: cdc5

target:
  dataset: treasury/auctions
  max_records_per_file: 20000

schedule:
  enabled: false
  expression: "cron(0 21 * * ? *)"

runtime:
  engine: python_shell
  timeout_minutes: 20
