# Core banking gia lap: Postgres corebank (Berka doi +24 nam + simulator tu 2023-01-01).
# Phan tich nguon, schema, credential: docs/sourcing/corebank.md
# Dung profile src-vpc (Glue trong VPC, toi duoc may "he thong nguon") -> enabled: false
# cho toi khi repo ha tang tao profile do. Chay tren may: python -m local.run_entry corebank_account
# balance doi moi ngay co giao dich -> moi lan chay keo lai phan lon tai khoan dang hoat dong.

name: corebank_account
source_type: jdbc
description: Tai khoan tien gui — CDC1 theo updated_at
owner: namth
enabled: false

jdbc:
  # {host, port, username, password, dbname} — user etl_reader CHI DOC
  secret_name: fingraph/src/corebank_pg
  driver: postgresql
  query: |
    SELECT account_id, district_id, frequency, opened_date, currency, balance, status,
           created_at, updated_at
    FROM core.account
    WHERE updated_at > :watermark
    ORDER BY updated_at

cdc:
  mode: cdc1
  watermark_column: updated_at
  watermark_type: timestamp
  # Keo chong 5 phut: transaction mo truoc mot transaction khac nhung COMMIT sau no
  # se mang updated_at nho hon moc vua luu -> khong lookback la mat dong do.
  lookback_seconds: 300
  initial_watermark: "1970-01-01T00:00:00+00:00"

target:
  dataset: corebank/account

schedule:
  # 01:00 gio VN. Bat sau khi profile src-vpc ton tai va chay tay OK.
  enabled: false
  expression: "cron(0 18 * * ? *)"

runtime:
  profile: src-vpc
  timeout_minutes: 20
