# Nguồn RDS — CHƯA DÙNG, chưa dựng RDS trong hạ tầng.
#
# Để sẵn entry này làm hai việc:
#   - chứng minh framework cắm thêm nguồn database chỉ tốn một file YAML
#   - khi nào dựng RDS thì đổi enabled: true là chạy, không viết dòng code nào
#
# Kết nối lấy từ Secrets Manager theo đúng định dạng RDS tự sinh khi bật
# "managed credentials": {host, port, username, password, dbname}.

name: pg_instruments
source_type: jdbc
description: Danh muc cong cu tai chinh tu Postgres
owner: namth
enabled: false               # bat khi da dung RDS

jdbc:
  secret_name: fingraph/rds/instruments
  driver: postgresql
  schema: public
  table: instruments
  num_partitions: 1

cdc:
  mode: cdc1
  watermark_column: updated_at
  watermark_type: timestamp
  # Kéo chồng 10 phút để bắt bản ghi commit muộn hơn giá trị updated_at
  # của chính nó (giao dịch dài). Cái giá là bản ghi trùng -> bronze khử.
  lookback_seconds: 600
  initial_watermark: "2020-01-01T00:00:00+00:00"

target:
  dataset: rds/instruments

schedule:
  enabled: false
  expression: "rate(1 hour)"

runtime:
  engine: python_shell
  timeout_minutes: 30
  additional_python_modules:
    - psycopg2-binary==2.9.9
