name: CI

# PR        -> test (Python 3.9 Glue + 3.12 Lambda). Không đụng AWS.
# push main -> test -> deploy dev bằng `python -m deploy.deploy`:
#                upload etl.zip + bootstrap, cập nhật code Lambda, ghi con trỏ
#                release (SSM), đồng bộ entry YAML vào bảng job_config.
#
# KHÔNG chạy Terraform. Glue job, bảng, Lambda, IAM đều do repo hạ tầng tạo
# sẵn và công bố tên ở SSM /fingraph/<env>/platform/*. Repo này chỉ đổ CODE
# và CẤU HÌNH vào khuôn đó.
#
# Quyền AWS: OIDC role fingraph-etl-deployer (repo hạ tầng, terraform/bootstrap),
# chỉ tin repo này ở nhánh main, quyền hẹp: S3 _ops/etl/* + _ops/silver/ddl/*,
# ghi bảng *-job-config, update-function-code đúng các Lambda nền tảng, SSM
# /fingraph/<env>/etl/*. Không có quyền IAM, không tạo/xoá resource.
#
# Cần repository VARIABLE (không phải secret): AWS_DEPLOY_ROLE_ARN.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy dev cho commit này (chạy lại khi lần trước lỗi)"
        type: boolean
        default: false

permissions:
  contents: read

# PR: lần push mới huỷ lần cũ. main: xếp hàng, không huỷ (mỗi commit một deploy)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Cung mot package chay o hai noi, hai phien ban:
        #   3.9  — Glue Python Shell
        #   3.12 — Lambda (orchestrator trigger, schedule-sync, silver router)
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            sourcing/requirements.txt

      - name: Cai thu vien
        run: pip install -r requirements-dev.txt

      - name: pytest
        run: python -m pytest -q

  deploy-dev:
    name: Deploy dev
    needs: pytest
    if: >-
      github.ref == 'refs/heads/main' && (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC sang AWS
      contents: read
    # Hai deploy khong bao gio chay chong (con tro release + config-sync)
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Cai thu vien
        run: pip install -r requirements-dev.txt

      - name: Kiem tra AWS_DEPLOY_ROLE_ARN
        run: |
          if [ -z "${{ vars.AWS_DEPLOY_ROLE_ARN }}" ]; then
            echo "::error::Thieu repository VARIABLE AWS_DEPLOY_ROLE_ARN (output etl_deployer_role_arn cua terraform/bootstrap o repo ha tang)."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: etl-deploy-dev

      - name: Deploy
        run: python -m deploy.deploy --env dev --sha "$GITHUB_SHA"
