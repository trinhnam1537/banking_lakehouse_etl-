# Cong ty me (co the o nuoc ngoai: Danone FR, Schaeffler DE) — lay tu khoi
# `included` cua cung response gleif_lei (include=direct-parent,ultimate-parent).
#
# Minh hoa ba thu: records_path khac `data`, loc theo loai ban ghi, va khu
# trung lap (mot cong ty me xuat hien nhieu lan: vua la me truc tiep vua la
# me cuoi cung, cua nhieu con).

name: gleif_parent_entity
description: Phap nhan la cong ty me cua phap nhan VN
owner: namth
enabled: true

source:
  dataset: gleif/lei_records
  records_path: included
  filter: "record_type = 'lei-records'"     # bo reporting-exceptions

target:
  database: track_a_silver
  table: gleif_parent_entity
  partition_by: [ds_partition_date]

columns:
  - {name: record_type, path: type, keep: false}
  - {name: lei, path: id, nullable: false}
  - {name: legal_name, path: attributes.entity.legalName.name}
  - {name: legal_country, path: attributes.entity.legalAddress.country}
  - {name: hq_country, path: attributes.entity.headquartersAddress.country}
  - {name: legal_form_code, path: attributes.entity.legalForm.id}
  - {name: entity_status, path: attributes.entity.status}

technical:
  keys: [lei]

writer:
  type: simple
  mode: overwrite_partition

quality:
  not_null: [lei]
  duplicate_keys: warn      # trung la binh thuong o day (me cua nhieu con)
