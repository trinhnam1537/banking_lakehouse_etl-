# Phap nhan Viet Nam (GLEIF) — SCD2: giu moi phien ban ho so.
#
# Nguon `gleif_lei` la CDC5 (anh chup day du 374 phap nhan VN moi lan) ->
# writer.snapshot = true: LEI vang mat trong anh moi = da bi xoa/chuyen di.
#
# Cong ty me: relationships.direct-parent.data.id CHI la LEI khi
# data.type = 'lei-records'; neu type = 'reporting-exceptions' thi id la ma
# ngoai le. Nen boc hai cot trung gian (keep: false) roi tinh bang expr.

name: gleif_legal_entity
description: Phap nhan VN co LEI, kem LEI cong ty me truc tiep va cuoi cung
owner: namth
enabled: true

source:
  dataset: gleif/lei_records
  records_path: data

target:
  database: track_a_silver
  table: gleif_legal_entity
  ddl: track_a_silver/gleif_legal_entity.sql     # tao bang tu file DDL (sua tay duoc)

columns:
  - {name: lei, path: id, nullable: false, comment: "Legal Entity Identifier"}
  - {name: legal_name, path: attributes.entity.legalName.name}
  - {name: legal_name_language, path: attributes.entity.legalName.language}
  - {name: registered_as, path: attributes.entity.registeredAs, comment: "Ma so doanh nghiep tai co quan dang ky"}
  - {name: registration_authority_id, path: attributes.entity.registeredAt.id}
  - {name: jurisdiction, path: attributes.entity.jurisdiction}
  - {name: legal_form_code, path: attributes.entity.legalForm.id, comment: "Ma ELF (ISO 20275)"}
  - {name: entity_category, path: attributes.entity.category}
  - {name: entity_status, path: attributes.entity.status}
  - {name: legal_country, path: attributes.entity.legalAddress.country}
  - {name: legal_region, path: attributes.entity.legalAddress.region}
  - {name: legal_city, path: attributes.entity.legalAddress.city}
  - {name: hq_country, path: attributes.entity.headquartersAddress.country}
  - {name: registration_status, path: attributes.registration.status}
  - {name: initial_registration_ts, path: attributes.registration.initialRegistrationDate, type: timestamp}
  - {name: last_update_ts, path: attributes.registration.lastUpdateDate, type: timestamp}
  - {name: next_renewal_ts, path: attributes.registration.nextRenewalDate, type: timestamp}
  # --- trung gian: dung de tinh LEI me, khong ghi xuong bang ---
  - {name: _dp_type, path: relationships.direct-parent.data.type, keep: false}
  - {name: _dp_id, path: relationships.direct-parent.data.id, keep: false}
  - {name: _up_type, path: relationships.ultimate-parent.data.type, keep: false}
  - {name: _up_id, path: relationships.ultimate-parent.data.id, keep: false}
  - name: direct_parent_lei
    expr: "CASE WHEN _dp_type = 'lei-records' THEN _dp_id END"
    comment: "Nguon canh fin:isDirectlyOwnedBy"
  - name: ultimate_parent_lei
    expr: "CASE WHEN _up_type = 'lei-records' THEN _up_id END"
  # --- envelope: ngay golden copy doi MOI NGAY -> khong tinh vao ds_hash,
  #     neu khong moi phap nhan deu "thay doi" hang ngay ---
  - {name: golden_copy_ts, from: response, path: meta.goldenCopy.publishDate, type: timestamp, hash: false}

technical:
  keys: [lei]
  cdc_index: last_update_ts

writer:
  type: scd2
  snapshot: true

quality:
  not_null: [lei, legal_name]
  duplicate_keys: fail      # LEI trung trong mot anh chup = nguon hong, dung ghi
