# To chuc tin dung My (FDIC) — SCD4a snapshot: moi ngay mot anh chup day du,
# ds_record_status so voi anh truoc (I/U/N/D).
#
# Ban ghi FDIC boc them mot cap: {data: {...95 cot}, score} -> path "data.X".
# Ngay thang dang MM/dd/yyyy -> can `format`.

name: fdic_institution
description: To chuc tin dung duoc FDIC bao hiem, anh chup hang ngay
owner: namth
enabled: true

source:
  dataset: fdic/institutions
  records_path: data

target:
  database: track_a_silver
  table: fdic_institution

columns:
  - {name: cert, path: data.CERT, type: int, nullable: false, comment: "Ma FDIC"}
  - {name: fed_rssd, path: data.FED_RSSD, type: bigint, comment: "Ma Fed — noi sang du lieu Fed"}
  - {name: name, path: data.NAME}
  - {name: prior_name, path: data.PRIORNAME1}
  - {name: new_cert, path: data.NEWCERT, type: int, comment: "Da sap nhap vao CERT nay"}
  - {name: active, path: data.ACTIVE, type: boolean}
  - {name: bank_class, path: data.BKCLASS}
  - {name: charter_agent, path: data.CHRTAGNT}
  - {name: regulator, path: data.REGAGNT}
  - {name: address, path: data.ADDRESS}
  - {name: city, path: data.CITY}
  - {name: state_code, path: data.STALP}
  - {name: zip, path: data.ZIP}
  - {name: latitude, path: data.LATITUDE, type: double}
  - {name: longitude, path: data.LONGITUDE, type: double}
  - {name: metro_area, path: data.CBSA_METRO_NAME}
  - {name: website, path: data.WEBADDR}
  - {name: established_date, path: data.ESTYMD, type: date, format: MM/dd/yyyy}
  - {name: insured_date, path: data.INSDATE, type: date, format: MM/dd/yyyy}
  - {name: last_change_date, path: data.DATEUPDT, type: date, format: MM/dd/yyyy}
  # Ngay FDIC chay xuat du lieu — doi moi lan, khong phai thay doi cua ngan hang
  - {name: fdic_run_date, path: data.RUNDATE, type: date, format: MM/dd/yyyy, hash: false}

technical:
  keys: [cert]

writer:
  type: scd4a
  emit_deletes: true

quality:
  not_null: [cert, name]
  min_rows: 20000            # FDIC co ~27.8k; it hon nhieu = keo thieu trang
  max_cast_error_ratio: 0.001
