# Silver IBM AML: nhan rua tien den tre (landing/aml/labels/). Mot dong = mot giao dich.
# CHI dung de huan luyen / danh gia, KHONG la dac trung cho mo hinh thoi gian thuc.
# Noi: silver_aml.transfer.txn_id = label.txn_id.

name: aml_label
description: IBM AML - nhan rua tien tung giao dich (den tre 14 ngay)
owner: namth
enabled: true

source:
  dataset: aml/labels

target:
  database: silver_aml
  table: label
  ddl: silver_aml/label.sql

columns:
  - {name: txn_id, nullable: false, comment: "Khoa noi voi silver_aml.transfer"}
  - {name: is_laundering, type: boolean, nullable: false, comment: "true = giao dich thuoc mot vu rua tien"}
  - {name: label_file, path: _src_file, hash: false, comment: "File nhan goc trong _inbox (ngay nhan duoc biet)"}

technical:
  keys: [txn_id]

writer:
  type: simple
  mode: append

quality:
  not_null: [txn_id, is_laundering]
  max_cast_error_ratio: 0.0
  duplicate_keys: warn

runtime:
  size: S
  timeout_minutes: 60
