# Silver core banking — tai lieu: docs/sourcing/corebank.md (muc 6. Silver)
# Nguon: entry sourcing `corebank_disp` -> landing/corebank/disp/ (manifest -> Lambda trigger -> entry nay)
#
# Canh do thi so huu: client -[OWNER | DISPONENT]-> account. Moi tai khoan dung MOT OWNER.

name: corebank_disp
description: Quyen cua khach tren tai khoan (OWNER/DISPONENT) - SCD2
owner: namth
enabled: true

source:
  dataset: corebank/disp

target:
  database: silver_corebank
  table: disp

columns:
  - {name: disp_id, type: int, nullable: false}
  - {name: client_id, type: int, nullable: false}
  - {name: account_id, type: int, nullable: false}
  - {name: disp_type, comment: "OWNER | DISPONENT"}
  - {name: source_created_at, path: created_at, type: timestamp, hash: false,
     comment: "created_at o he thong nguon (gio THAT, khong phai gio nghiep vu)"}
  - {name: source_updated_at, path: updated_at, type: timestamp, hash: false,
     comment: "updated_at o nguon — moc CDC1, thu tu chon ban moi nhat"}
  - {name: is_owner, type: boolean, expr: "disp_type = 'OWNER'"}

technical:
  keys: [disp_id]
  # Hai ban cua cung key trong mot lo (lookback keo chong) -> giu ban updated_at lon nhat
  cdc_index: source_updated_at
  partition_date: ingest_date

writer:
  type: scd2
  # Nguon CDC1: manifest chi chua dong DOI. Key vang mat KHONG co nghia la bi xoa.
  snapshot: false

quality:
  not_null: [disp_id, client_id, account_id, disp_type]
  max_cast_error_ratio: 0.0
  duplicate_keys: warn

runtime:
  worker_type: G.1X
  number_of_workers: 2
  timeout_minutes: 30
