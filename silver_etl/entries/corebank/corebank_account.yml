# Silver core banking — tai lieu: docs/sourcing/corebank.md (muc 6. Silver)
# Nguon: entry sourcing `corebank_account` -> landing/corebank/account/ (manifest -> Lambda trigger -> entry nay)
#
# SCD2. balance doi moi ngay co giao dich -> moi ngay mot phien ban cho tai khoan hoat dong:
# bang nay tra loi duoc "so du cuoi ngay D" ma khong phai cong don so giao dich.

name: corebank_account
description: Tai khoan tien gui - thuoc tinh va so du, lich su SCD2
owner: namth
enabled: true

source:
  dataset: corebank/account

target:
  database: silver_corebank
  table: account

columns:
  - {name: account_id, type: int, nullable: false}
  - {name: district_id, type: int, comment: "Chi nhanh mo tai khoan"}
  - {name: frequency_code, path: frequency, comment: "Ma Sec goc cua ky sao ke"}
  - {name: opened_date, type: date}
  - {name: currency}
  - {name: balance, type: "decimal(18,2)", comment: "So du tai thoi diem keo; am = thau chi"}
  - {name: status}
  - {name: source_created_at, path: created_at, type: timestamp, hash: false,
     comment: "created_at o he thong nguon (gio THAT, khong phai gio nghiep vu)"}
  - {name: source_updated_at, path: updated_at, type: timestamp, hash: false,
     comment: "updated_at o nguon — moc CDC1, thu tu chon ban moi nhat"}
  - name: statement_frequency
    expr: >-
      CASE frequency_code WHEN 'POPLATEK MESICNE' THEN 'MONTHLY'
                          WHEN 'POPLATEK TYDNE' THEN 'WEEKLY'
                          WHEN 'POPLATEK PO OBRATU' THEN 'AFTER_TRANSACTION' END
  - {name: is_overdrawn, type: boolean, expr: "balance < 0"}

technical:
  keys: [account_id]
  # Hai ban cua cung key trong mot lo (lookback keo chong) -> giu ban updated_at lon nhat
  cdc_index: source_updated_at
  partition_date: ingest_date

writer:
  type: scd2
  # Nguon CDC1: manifest chi chua dong DOI. Key vang mat KHONG co nghia la bi xoa.
  snapshot: false

quality:
  not_null: [account_id, district_id, opened_date]
  max_cast_error_ratio: 0.0
  duplicate_keys: warn

runtime:
  worker_type: G.1X
  number_of_workers: 2
  timeout_minutes: 30
