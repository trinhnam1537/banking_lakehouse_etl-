# Thong ke 24h moi cap Binance — bang su kien, simple APPEND.
#
# Moi lan keo la mot anh chup cua ~3.700 cap tai mot thoi diem. Khoa
# (symbol, close_time) phan biet cac lan chup. Append idempotent theo
# ds_source: chay lai cung manifest thi xoa dong cu cua manifest do roi ghi lai.

name: binance_ticker_24h
description: Thong ke 24 gio cua moi cap giao dich Binance, moi lan keo mot anh
owner: namth
enabled: true

source:
  dataset: binance/ticker_24hr
  records_path: ""            # response la mang ban ghi o goc

target:
  database: track_a_silver
  table: binance_ticker_24h
  partition_by: [ds_partition_date]

columns:
  - {name: symbol, nullable: false}
  - {name: last_price, path: lastPrice, type: "decimal(38,18)"}
  - {name: open_price, path: openPrice, type: "decimal(38,18)"}
  - {name: high_price, path: highPrice, type: "decimal(38,18)"}
  - {name: low_price, path: lowPrice, type: "decimal(38,18)"}
  - {name: weighted_avg_price, path: weightedAvgPrice, type: "decimal(38,18)"}
  - {name: price_change_pct, path: priceChangePercent, type: double}
  - {name: base_volume, path: volume, type: "decimal(38,18)"}
  - {name: quote_volume, path: quoteVolume, type: "decimal(38,18)"}
  - {name: trade_count, path: count, type: bigint}
  - {name: open_time, path: openTime, type: timestamp, format: epoch_ms}
  - {name: close_time, path: closeTime, type: timestamp, format: epoch_ms}
  - {name: notional_24h, type: "decimal(38,8)", expr: "weighted_avg_price * base_volume"}

technical:
  keys: [symbol, close_time]
  cdc_index: close_time

writer:
  type: simple
  mode: append

quality:
  not_null: [symbol]
