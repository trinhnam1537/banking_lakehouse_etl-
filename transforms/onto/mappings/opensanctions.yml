# Mapping OpenSanctions (silver_opensanctions) -> FinGraph. Buoc O5 luot 2; thiet ke: docs/ONTOLOGY.md muc 5.5,
# use case B (AML: chuoi so huu toi doi tuong cam van, CQ8).
#
# MOT khong gian dinh danh fin:Party cho moi thuc the phap ly FtM (Person / Company / Organization /
# LegalEntity / PublicBody), khoa entity_id. Doi tuong bi cam van (is_target) gan THEM fin:SanctionedEntity.
# Vi sao khong tach lop chinh: canh so huu (Ownership) noi ca doi tuong cam van lan cong ty lien quan
# khong bi cam van; cung lop + cung khoa -> cung uid du dong nguon den tu muc nao.
#
# Nhan = ten cong khai trong danh sach cam van (khong phai PII cua khach ngan hang).
# phones / emails (PII) KHONG dua len do thi.
#
# Canh fin:isDirectlyOwnedBy: tu thuc the FtM loai Ownership (asset -> owner, weight = ty le so huu).
# Chi giu canh co CA HAI dau la thuc the phap ly da len do thi (join), con lai (vd tau, may bay) bo.

source_system: opensanctions
database: silver_opensanctions
reviewed_by: "namth (cho duyet)"

entities:
  # Doi tuong bi cam van la NGUOI (doi chieu khach hang, CQ8)
  - id: target_person
    class: fin:Party
    also: [fin:SanctionedEntity, fin:Person]
    sql: |
      SELECT entity_id, entity_schema,
             coalesce(element_at(properties['name'], 1), caption) AS name,
             element_at(properties['birthDate'], 1) AS birth_date,
             array_join(properties['country'], ',') AS countries,
             array_join(properties['topics'], ',') AS topics,
             first_seen
      FROM {silver_opensanctions.entity}
      WHERE is_target AND entity_schema = 'Person'
    key: [entity_id]
    label: "name"
    valid_from: "to_date(first_seen)"
    attributes:
      schema: entity_schema
      birth_date: birth_date
      countries: countries
      topics: topics

  # Doi tuong bi cam van la to chuc
  - id: target_org
    class: fin:Party
    also: [fin:SanctionedEntity, fin:Organization]
    sql: |
      SELECT entity_id, entity_schema,
             coalesce(element_at(properties['name'], 1), caption) AS name,
             element_at(properties['birthDate'], 1) AS birth_date,
             array_join(properties['country'], ',') AS countries,
             array_join(properties['topics'], ',') AS topics,
             first_seen
      FROM {silver_opensanctions.entity}
      WHERE is_target AND entity_schema IN ('Company', 'Organization', 'LegalEntity', 'PublicBody')
    key: [entity_id]
    label: "name"
    valid_from: "to_date(first_seen)"
    attributes:
      schema: entity_schema
      birth_date: birth_date
      countries: countries
      topics: topics

  # Nguoi lien quan (chu so huu, giam doc...) KHONG bi cam van
  - id: related_person
    class: fin:Party
    also: [fin:Person]
    sql: |
      SELECT entity_id, entity_schema,
             coalesce(element_at(properties['name'], 1), caption) AS name,
             element_at(properties['birthDate'], 1) AS birth_date,
             array_join(properties['country'], ',') AS countries,
             array_join(properties['topics'], ',') AS topics,
             first_seen
      FROM {silver_opensanctions.entity}
      WHERE NOT coalesce(is_target, false) AND entity_schema = 'Person'
    key: [entity_id]
    label: "name"
    valid_from: "to_date(first_seen)"
    attributes:
      schema: entity_schema
      birth_date: birth_date
      countries: countries
      topics: topics

  # To chuc lien quan KHONG bi cam van
  - id: related_org
    class: fin:Party
    also: [fin:Organization]
    sql: |
      SELECT entity_id, entity_schema,
             coalesce(element_at(properties['name'], 1), caption) AS name,
             element_at(properties['birthDate'], 1) AS birth_date,
             array_join(properties['country'], ',') AS countries,
             array_join(properties['topics'], ',') AS topics,
             first_seen
      FROM {silver_opensanctions.entity}
      WHERE NOT coalesce(is_target, false) AND entity_schema IN ('Company', 'Organization', 'LegalEntity', 'PublicBody')
    key: [entity_id]
    label: "name"
    valid_from: "to_date(first_seen)"
    attributes:
      schema: entity_schema
      birth_date: birth_date
      countries: countries
      topics: topics


edges:
  - id: owned_by
    predicate: fin:isDirectlyOwnedBy
    sql: |
      WITH le AS (
        SELECT entity_id FROM {silver_opensanctions.entity}
        WHERE entity_schema IN ('Person', 'Company', 'Organization', 'LegalEntity', 'PublicBody')),
      own AS (
        SELECT entity_id AS ownership_id,
               element_at(coalesce(properties['asset'], properties['assetId']), 1) AS asset_id,
               element_at(coalesce(properties['owner'], properties['ownerId']), 1) AS owner_id,
               try_cast(regexp_extract(element_at(properties['percentage'], 1), '([0-9.]+)', 1) AS double) AS pct,
               to_date(element_at(properties['startDate'], 1)) AS start_date
        FROM {silver_opensanctions.entity} WHERE entity_schema = 'Ownership')
      SELECT own.* FROM own
      JOIN le a ON a.entity_id = own.asset_id
      JOIN le o ON o.entity_id = own.owner_id
      WHERE own.asset_id <> own.owner_id
    subject: {entity: target_person, key: [asset_id]}
    object: {entity: target_person, key: [owner_id]}
    weight: "pct / 100"
    valid_from: start_date
    source_key: "concat('ownership=', ownership_id)"
